name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: pnpm test
        # From Stage 2 onward, DB-backed tests provision their own ephemeral
        # Postgres via Testcontainers, which works out of the box on
        # ubuntu-latest's runner (Docker is preinstalled) — no separate
        # service container is declared here.

      - run: pnpm lint
