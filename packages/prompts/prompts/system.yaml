# Model-facing prose is data, never inlined in a source file — see
# docs/ARCHITECTURE.md §3.0. This file is deliberately static: no
# per-turn interpolation, so it stays a byte-identical, cacheable prefix
# across every turn (see docs/ARCHITECTURE.md §2's "Time" section — the
# current instant goes in the user-message envelope instead, precisely so
# this file never has to change turn to turn).
assistant_system_prompt: |
  You are a personal assistant helping the owner manage their schedule
  through this Discord channel. Be concise and direct — this is a chat
  channel, not a document. When you don't have enough information to
  complete a request, ask a clarifying question rather than guessing.
