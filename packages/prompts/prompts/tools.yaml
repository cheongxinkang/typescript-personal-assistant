# Tool descriptions and field descriptions — model-facing prose, kept as
# data per docs/ARCHITECTURE.md §3.0 rule 2. Any syntax promised here (the
# date-expression grammar) must match what
# packages/core/src/dateexpr.ts actually accepts — see Requirement 21.
add_event:
  description: >
    Add an event to the owner's schedule. Provide a short title and a date
    expression describing when it happens. Never provide a resolved
    timestamp — the backend resolves the expression itself, since models
    get date arithmetic wrong in exactly the cases that matter (month ends,
    DST boundaries).
  fields:
    title: A short, human-readable title for the event.
    dateExpression: >
      When the event happens. Accepted forms: an ISO date (YYYY-MM-DD), the
      word "today" or "tomorrow", a relative offset like "+3d", or a
      three-letter weekday abbreviation (mon, tue, wed, thu, fri, sat, sun)
      meaning the next occurrence of that day — never today, even if today
      already matches. Optionally followed by a 24-hour time, e.g.
      "tomorrow 19:00". Omitting the time defaults to the start of that day.
    durationMinutes: Optional. How long the event lasts, in minutes. Defaults to 30 if omitted.

get_schedule:
  description: >
    Read back the owner's schedule for a date range, grouped by day. Use
    this before answering any question about what's already on the
    schedule — never guess or rely on conversation history for it.
  fields:
    start: >
      The first day to include. Accepted forms: an ISO date (YYYY-MM-DD),
      "today", "tomorrow", a relative offset like "+3d", or a weekday
      abbreviation (mon, tue, wed, thu, fri, sat, sun). A time component is
      accepted but ignored — the whole day is included either way.
    end: >
      The last day to include (inclusive), in the same forms as `start`.
      Must not be before `start`, and the range must not exceed 31 days.
    includeCancelled: >
      Optional. When true, also includes cancelled and superseded
      (rescheduled-away-from) events, which are excluded by default.

add_task:
  description: >
    Add a task — work to be done, independent of when. Use this instead of
    add_event when the owner hasn't said when something will happen, only
    that it needs doing.
  fields:
    title: A short, human-readable title for the task.
    description: Optional. Extra detail giving the owner clarity on what the task entails.
    estimatedMinutes: Optional. How long the task is expected to take, in minutes.
    deadline: >
      Optional. When the task is due, in the same date-expression forms as
      add_event's dateExpression.
    projectId: Optional. The id of the project this task belongs to, if any.

update_task:
  description: >
    Change an existing task: mark it complete, cancel it, or edit its
    details. Look up its id from a prior add_task result or from the
    schedule/task list — never guess one.
  fields:
    action: One of "complete", "cancel", or "edit".
    taskId: The id of the task to change.
    title: Optional, only for action "edit". A new title for the task.
    description: Optional, only for action "edit". A new description for the task.
    estimatedMinutes: Optional, only for action "edit". A new time estimate, in minutes.
    deadline: >
      Optional, only for action "edit". A new deadline, in the same
      date-expression forms as add_event's dateExpression.

update_event:
  description: >
    Change an existing event: mark it complete, cancel it, move it to a
    new time, or split it into a completed portion and a remaining
    portion. Look up its id from a prior add_event or get_schedule result —
    never guess one.
  fields:
    action: One of "complete", "cancel", "move", or "split".
    eventId: The id of the event to change.
    actualMinutes: >
      Optional, only for action "complete". How long it actually took, in
      minutes, if different from the planned duration.
    dateExpression: >
      Required for action "move". The new time, in the same forms as
      add_event's dateExpression.
    completedMinutes: >
      Required for action "split". How many minutes were actually
      completed; the rest is reported as remaining, to be scheduled
      separately.

add_project:
  description: >
    Start a project — a longer-lived goal you'll break into tasks. If a
    description is given, tasks are generated for it in the background
    (this can take a few minutes, sometimes longer) and posted once ready;
    say so rather than implying it happened instantly.
  fields:
    title: A short, human-readable title for the project.
    description: >
      Optional but recommended. What the project involves — the more
      concrete, the better the generated tasks. Omit only if the owner
      genuinely wants an empty project to add tasks to by hand.
    targetDate: >
      Optional. When the project should be done by, in the same
      date-expression forms as add_event's dateExpression.

generate_schedule:
  description: >
    Plan the upcoming week (or a different horizon) by placing open,
    not-yet-scheduled tasks into free time. This submits a background job
    and does not create anything immediately — the result, including any
    tasks that didn't fit, arrives as a separate message once it's ready.
    The owner must review and confirm the result (confirm_schedule) before
    it becomes real, confirmed schedule.
  fields:
    horizonDays: >
      Optional. How many days ahead to plan for. Defaults to a
      standard planning horizon if omitted.

confirm_schedule:
  description: >
    Confirm a previously generated schedule proposal, turning its proposed
    events into real, planned ones. Only call this after the owner has
    actually agreed to the proposal — never on your own initiative.
  fields:
    generationRunId: The id of the generation run to confirm, from its announcement message.
