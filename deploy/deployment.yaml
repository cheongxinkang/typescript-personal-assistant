apiVersion: apps/v1
kind: Deployment
metadata:
  name: assistant-server
  namespace: personal-assistant
spec:
  replicas: 1
  # Recreate, not the default RollingUpdate: a rolling update briefly runs
  # two pods, which from Stage 5 onward means two scheduler tick loops and
  # duplicate reminders. See docs/ARCHITECTURE.md §6.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: assistant-server
  template:
    metadata:
      labels:
        app: assistant-server
    spec:
      # The repo (and its linked GHCR package) is private, so the node needs
      # credentials to pull — created via `kubectl create secret
      # docker-registry ghcr-pull-secret` from a gh CLI token with
      # write:packages scope. See deploy/README.md.
      imagePullSecrets:
        - name: ghcr-pull-secret
      # Requirement 21/27: migrations are checked-in SQL, applied here, not
      # generated at deploy time. The server itself also runs runMigrations()
      # on boot for local/dev convenience (see apps/server/src/index.ts) —
      # both are safe since drizzle tracks what's already applied.
      initContainers:
        - name: migrate
          image: ghcr.io/cheongxinkang/typescript-personal-assistant:latest
          command: ["node", "node_modules/@assistant/db/dist/migrate.js"]
          envFrom:
            - secretRef:
                name: assistant-secrets
      containers:
        - name: server
          image: ghcr.io/cheongxinkang/typescript-personal-assistant:latest
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: assistant-secrets
          resources:
            # Node's --max-old-space-size in the Dockerfile is set relative
            # to this limit (192m for a 256Mi limit) — update both together.
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 30
