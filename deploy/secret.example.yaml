# Template only — never fill in real values here or commit the filled-in
# version. Two ways to actually create this secret on the cluster:
#
#   kubectl create secret generic assistant-secrets \
#     --namespace personal-assistant \
#     --from-env-file=.env
#
# or, once GitOps is decided (see docs/architecture-roadmap.md's open
# questions), via SOPS/sealed-secrets so an encrypted version can be
# committed. k3s does not encrypt Secrets at rest by default — see
# docs/ARCHITECTURE.md §6.
apiVersion: v1
kind: Secret
metadata:
  name: assistant-secrets
  namespace: personal-assistant
type: Opaque
stringData:
  DISCORD_BOT_TOKEN: ""
  DISCORD_CHANNEL_ID: ""
  ANTHROPIC_API_KEY: ""
  DATABASE_URL: ""
  OWNER_TIMEZONE: ""
