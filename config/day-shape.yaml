# The owner's day shape: waking hours per weekday, in local time
# (interpreted in OWNER_TIMEZONE from .env). Time outside these windows is
# not schedulable — see docs/product-specs/phase-2-tools.md, Requirement 18
# and decision 13. Loaded and validated at boot in Stage 4; nothing reads
# this file at runtime except that one loader.
#
# PLACEHOLDER VALUES — edit before Stage 3's deploy checkpoint. These are a
# generic 08:00-22:00 weekday / 09:00-23:00 weekend guess, not your actual
# schedule. A day can be omitted or left with start == end to mark it fully
# unschedulable (e.g. a day you never want work placed on).

monday:
  start: "08:00"
  end: "22:00"
tuesday:
  start: "08:00"
  end: "22:00"
wednesday:
  start: "08:00"
  end: "22:00"
thursday:
  start: "08:00"
  end: "22:00"
friday:
  start: "08:00"
  end: "22:00"
saturday:
  start: "09:00"
  end: "23:00"
sunday:
  start: "09:00"
  end: "23:00"
